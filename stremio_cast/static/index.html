<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stremio Cast</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b92a3; --accent: #7b5cff; --accent2: #9d86ff; --danger: #ff5c7a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: 180px; }
  button, select, input { font: inherit; color: inherit; }
  header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1100px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; margin-right: auto; display: flex; gap: 8px; align-items: center; }
  .brand svg { color: var(--accent2); }
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--accent); color: white; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .btn { border: 1px solid var(--line); background: var(--panel2); padding: 10px 14px; border-radius: var(--radius); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: white; font-weight: 600; }
  .btn.primary:hover { background: var(--accent2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .card:hover { border-color: var(--accent); }
  .card .poster { aspect-ratio: 2/3; background: var(--panel2) center/cover no-repeat; }
  .card .meta { padding: 8px 10px; font-size: 13px; }
  .card .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--panel2); color: var(--muted); }
  .hero { position: relative; border-radius: var(--radius); overflow: hidden; margin-top: 16px; border: 1px solid var(--line); }
  .hero .bg { position: absolute; inset: 0; background: center/cover no-repeat; opacity: .25; }
  .hero .in { position: relative; display: flex; gap: 16px; padding: 16px; }
  .hero img { width: 110px; border-radius: 8px; flex: none; }
  .hero h2 { margin: 0 0 4px; }
  .hero p { margin: 6px 0 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 10px; }
  .chips button { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: white; }
  .eps { display: flex; flex-direction: column; gap: 8px; }
  .ep { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 8px; cursor: pointer; text-align: left; width: 100%; }
  .ep:hover, .ep.on { border-color: var(--accent); }
  .ep .th { width: 120px; aspect-ratio: 16/9; border-radius: 8px; background: var(--panel2) center/cover no-repeat; flex: none; }
  .ep .n { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .ep .t { font-weight: 600; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 8px 0 4px; }
  .panel h3 { margin: 0 0 10px; font-size: 15px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } .ep .th { width: 96px; } .hero img { width: 84px; } }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  select { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; width: 100%; color: var(--text); }
  .stream { font-size: 12px; color: var(--muted); white-space: pre-line; margin-bottom: 10px; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .progress { height: 4px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .err { color: var(--danger); font-size: 13px; }
  .spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    display: inline-block; animation: s 0.8s linear infinite; vertical-align: -3px; }
  @keyframes s { to { transform: rotate(360deg); } }

  #np { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: none; }
  #np .wrap { max-width: 1100px; margin: 0 auto; }
  #np .top { display: flex; gap: 12px; align-items: center; }
  #np img { width: 40px; height: 60px; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  #np .title { flex: 1; min-width: 0; }
  #np .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2);
    display: inline-grid; place-items: center; cursor: pointer; flex: none; }
  .icon:hover { border-color: var(--accent); }
  .icon.big { background: var(--accent); border-color: var(--accent); color: white; }
  .seek { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .np-tracks { display: grid; grid-template-columns: 1fr 1fr auto 110px; gap: 8px; margin-top: 8px; align-items: center; }
  @media (max-width: 560px) { .np-tracks { grid-template-columns: 1fr 1fr; } }
  .np-tracks select { padding: 6px 8px; font-size: 13px; }
  .vol { display: flex; align-items: center; gap: 6px; }
  .vol input { width: 100%; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 8px; }
  .sec h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .link { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .link:hover { color: var(--text); }
  .qchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .qchip { display: inline-flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
  .qchip:hover { border-color: var(--accent); }
  .qchip button { background: none; border: 0; cursor: pointer; padding: 6px 4px 6px 12px; }
  .qchip .x { padding: 6px 10px 6px 6px; color: var(--muted); }
  .card { position: relative; }
  .card .x { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 26px; padding: 0; }
  .sync { display: inline-flex; align-items: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; }
  .sync button { border: 0; background: none; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 13px;
    font-variant-numeric: tabular-nums; }
  .sync button:hover { background: var(--panel); }
  .sync output { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
  .sync-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand" id="home" style="cursor:pointer" title="Home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><line x1="2" y1="20" x2="2.01" y2="20"/></svg>
      Stremio Cast
    </div>
    <div class="seg" id="devices"></div>
  </div>
</header>

<main>
  <form class="search" id="searchForm">
    <input id="q" placeholder="Search shows & movies…" autocomplete="off" enterkeyhint="search">
    <button class="btn primary">Search</button>
  </form>
  <div id="view"></div>
</main>

<div id="np">
  <div class="wrap">
    <div class="top">
      <img id="npPoster" alt="">
      <div class="title"><b id="npTitle">—</b><span class="muted" id="npSub"></span></div>
      <button class="icon" id="npBack" title="Back 10s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
      <button class="icon big" id="npPlay" title="Play/pause"></button>
      <button class="icon" id="npFwd" title="Forward 30s"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
      <button class="icon" id="npStop" title="Stop"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
    </div>
    <div class="seek"><span id="npPos">0:00</span><input type="range" id="npSeek" min="0" max="100" step="1" value="0"><span id="npDur">0:00</span></div>
    <div class="np-tracks">
      <select id="npAudio" title="Audio"></select>
      <select id="npSubs" title="Subtitles"></select>
      <div class="sync" id="npSync" title="Subtitle timing: + shows subtitles later, − earlier">
        <button data-d="-1">−1</button><button data-d="-0.5">−½</button><output id="npDelay">0.0s</output><button data-d="0.5">+½</button><button data-d="1">+1</button>
      </div>
      <div class="vol"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="npVol" min="0" max="100"></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const h = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const hh = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (hh ? hh + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const ICON_PLAY = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

const S = { devices: [], device: null, meta: null, season: null, ep: null, sess: null, status: null, seeking: false };

// ---------- devices
async function loadConfig() {
  const c = await api("/api/config");
  S.devices = c.devices;
  const saved = store.get("device");
  S.device = (S.devices.find(d => d.name === saved) || S.devices.find(d => d.default) || S.devices[0]).name;
  renderDevices();
}
function renderDevices() {
  $("#devices").innerHTML = S.devices.map(d =>
    `<button class="${d.name === S.device ? "on" : ""}" data-d="${h(d.name)}">${h(d.name.replace(/ TV$/, ""))}</button>`).join("");
  $("#devices").querySelectorAll("button").forEach(b => b.onclick = () => {
    S.device = b.dataset.d; store.set("device", S.device); renderDevices(); pollStatus();
  });
}

// ---------- home: recent searches + recently opened shows (stored server-side, shared across devices)
async function renderHome() {
  let r = { queries: [], shows: [] };
  try { r = await api("/api/recent"); } catch {}
  if (!r.queries.length && !r.shows.length) { $("#view").innerHTML = `<div class="empty">Search for something to watch.</div>`; return; }
  $("#view").innerHTML = `
    ${r.shows.length ? `<div class="sec"><h3>Recently opened</h3><button class="link" data-clear="shows">Clear</button></div>
      <div class="grid" style="margin-top:0">${r.shows.map((m, i) => `
        <div class="card" data-i="${i}"><div class="poster" style="background-image:url('${h(m.poster)}')"></div>
        <button class="x" data-rm="shows" data-i="${i}" title="Remove">×</button>
        <div class="meta"><b>${h(m.name)}</b><span class="muted">${h(m.year || "")}</span> <span class="tag">${m.type === "series" ? "Series" : "Movie"}</span></div></div>`).join("")}</div>` : ""}
    ${r.queries.length ? `<div class="sec"><h3>Recent searches</h3><button class="link" data-clear="queries">Clear</button></div>
      <div class="qchips">${r.queries.map((q, i) => `<span class="qchip"><button data-q="${i}">${h(q)}</button><button class="x" data-rm="queries" data-i="${i}" title="Remove">×</button></span>`).join("")}</div>` : ""}`;
  $("#view").querySelectorAll(".card").forEach(c => c.onclick = e => { if (!e.target.closest(".x")) openMeta(r.shows[c.dataset.i]); });
  $("#view").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("#q").value = r.queries[b.dataset.q]; $("#searchForm").requestSubmit(); });
  $("#view").querySelectorAll("[data-rm]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); await api(`/api/recent/${b.dataset.rm}/${b.dataset.i}`, { method: "DELETE" }); renderHome();
  });
  $("#view").querySelectorAll("[data-clear]").forEach(b => b.onclick = async () => {
    await api(`/api/recent?kind=${b.dataset.clear}`, { method: "DELETE" }); renderHome();
  });
}
$("#home").onclick = () => { $("#q").value = ""; S.meta = null; S.ep = null; renderHome(); };
$("#q").addEventListener("input", e => { if (!e.target.value.trim() && !S.meta) renderHome(); });

// ---------- search
$("#searchForm").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  try {
    const res = await api("/api/search?q=" + encodeURIComponent(q));
    if (!res.length) { $("#view").innerHTML = `<div class="empty">Nothing found for “${h(q)}”.</div>`; return; }
    $("#view").innerHTML = `<div class="grid">${res.map((m, i) => `
      <div class="card" data-i="${i}"><div class="poster" style="background-image:url('${h(m.poster)}')"></div>
      <div class="meta"><b>${h(m.name)}</b><span class="muted">${h(m.year || "")}</span> <span class="tag">${m.type === "series" ? "Series" : "Movie"}</span></div></div>`).join("")}</div>`;
    $("#view").querySelectorAll(".card").forEach(c => c.onclick = () => openMeta(res[c.dataset.i]));
  } catch (err) { $("#view").innerHTML = `<div class="empty err">${h(err.message)}</div>`; }
};

// ---------- show / movie
async function openMeta(m) {
  $("#view").innerHTML = `<div class="empty"><span class="spin"></span></div>`;
  const meta = await api(`/api/meta/${m.type}/${m.id}`);
  api("/api/recent/show", { method: "POST", body: { id: meta.id, type: m.type, name: meta.name, poster: meta.poster || m.poster, year: meta.year || m.year } }).catch(() => {});
  S.meta = meta; S.ep = null;
  const seasons = [...new Set(meta.videos.map(v => v.season))];
  const watched = store.get("lastSeason:" + meta.id);
  S.season = seasons.includes(watched) ? watched : (seasons.find(s => s > 0) ?? seasons[0]);
  $("#view").innerHTML = `
    <div class="hero"><div class="bg" style="background-image:url('${h(meta.background || meta.poster)}')"></div>
      <div class="in">${meta.poster ? `<img src="${h(meta.poster)}" alt="">` : ""}
        <div><h2>${h(meta.name)}</h2><span class="muted">${h(meta.year || "")}</span><p>${h(meta.description || "")}</p></div></div></div>
    <div id="body"></div>`;
  if (m.type === "movie") { S.ep = { movie: true }; $("#body").innerHTML = `<div id="castPanel"></div>`; prepare(); return; }
  renderSeasons(seasons);
}
function renderSeasons(seasons) {
  const eps = S.meta.videos.filter(v => v.season === S.season);
  $("#body").innerHTML = `
    <div class="chips">${seasons.map(s => `<button class="${s === S.season ? "on" : ""}" data-s="${s}">${s === 0 ? "Specials" : "Season " + s}</button>`).join("")}</div>
    <div class="eps">${eps.map(v => `
      <div><button class="ep ${S.ep && S.ep.episode === v.episode && S.ep.season === v.season ? "on" : ""}" data-e="${v.episode}">
        <div class="th" style="background-image:url('${h(v.thumbnail || "")}')"></div>
        <div><div class="n">Episode ${v.episode}${v.released ? " · " + new Date(v.released).toLocaleDateString() : ""}</div>
        <div class="t">${h(v.name || "Episode " + v.episode)}</div></div></button>
        ${S.ep && S.ep.episode === v.episode && S.ep.season === v.season ? `<div id="castPanel"></div>` : ""}</div>`).join("")}</div>`;
  $("#body").querySelectorAll(".chips button").forEach(b => b.onclick = () => { S.season = +b.dataset.s; S.ep = null; renderSeasons(seasons); });
  $("#body").querySelectorAll(".ep").forEach(b => b.onclick = () => {
    const v = eps.find(x => x.episode === +b.dataset.e);
    if (S.ep && S.ep.episode === v.episode && S.ep.season === v.season) { S.ep = null; renderSeasons(seasons); return; }
    S.ep = v; store.set("lastSeason:" + S.meta.id, v.season); renderSeasons(seasons); prepare();
  });
  if (S.ep) S.ep._seasons = seasons;
}

// ---------- prepare + cast panel
function label() {
  if (S.ep.movie) return S.meta.name;
  const e = S.ep; return `${S.meta.name} S${String(e.season).padStart(2, "0")}E${String(e.episode).padStart(2, "0")}${e.name ? " - " + e.name : ""}`;
}
function sid() { return S.ep.movie ? S.meta.id : `${S.meta.id}:${S.ep.season}:${S.ep.episode}`; }

async function prepare(streamIdx = 0) {
  const panel = $("#castPanel"); if (!panel) return;
  panel.innerHTML = `<div class="panel"><span class="spin"></span> <span class="muted">Finding streams…</span></div>`;
  const myEp = S.ep;
  try {
    const type = S.meta.type;
    const streams = await api(`/api/streams/${type}/${sid()}`);
    if (S.ep !== myEp) return;
    if (!streams.length) { panel.innerHTML = `<div class="panel err">No streams found.</div>`; return; }
    panel.innerHTML = `<div class="panel"><span class="spin"></span> <span class="muted">Opening stream & reading tracks…</span></div>`;
    const sess = await api("/api/prepare", { method: "POST", body: { type, id: sid(), stream: streamIdx, title: label() } });
    if (S.ep !== myEp) return;
    S.sess = sess; S.streams = streams; S.streamIdx = streamIdx;
    renderCastPanel();
  } catch (err) { if (S.ep === myEp) panel.innerHTML = `<div class="panel err">${h(err.message)}</div>`; }
}

function prefAudio(tracks, def) {
  const want = store.get("prefAudio");
  return (want && tracks.find(t => t.lang === want)?.index) ?? def;
}
function prefSub(sess) {
  // stored as {lang, source}; OpenSubtitles is instant so it's preferred, embedded only if already extracted
  const want = store.get("prefSub2", { lang: "eng", source: "o" });
  if (want === "off") return "";
  const ext = sess.external.find(e => e.lang === want.lang);
  const emb = sess.subtitles.filter(t => t.lang === want.lang && t.supported)
    .sort((a, b) => (a.forced - b.forced) || (/cc|sdh/i.test(a.title) - /cc|sdh/i.test(b.title)))[0];
  if (want.source === "e" && emb && sess.sub_status === "done") return "e:" + emb.index;
  if (ext) return ext.id;
  if (emb && sess.sub_status === "done") return "e:" + emb.index;
  return "";
}
const LANG = { eng: "English", jpn: "Japanese", spa: "Spanish", fre: "French", ger: "German", ita: "Italian", por: "Portuguese",
  chi: "Chinese", zho: "Chinese", vie: "Vietnamese", ara: "Arabic", rus: "Russian", kor: "Korean", pol: "Polish", tha: "Thai",
  ind: "Indonesian", tur: "Turkish", hin: "Hindi", dut: "Dutch", may: "Malay", fil: "Filipino", heb: "Hebrew" };
function subLang(sess, id) {
  if (!id) return null;
  if (id.startsWith("o:")) return sess.external.find(e => e.id === id)?.lang;
  return sess.subtitles.find(t => "e:" + t.index === id)?.lang;
}
function audioOpts(sess, sel) { return sess.audio.map(a => `<option value="${a.index}" ${a.index === sel ? "selected" : ""}>${h(a.label)}${a.default ? " · default" : ""}</option>`).join(""); }
function subOpts(sess, sel) {
  const ext = sess.external.map(e => `<option value="${h(e.id)}" ${e.id === sel ? "selected" : ""}>${h(LANG[e.lang] || e.lang)} — ${h(e.release || e.file || "")}${e.hash_match ? " ✓ exact" : ""}</option>`).join("");
  const embNote = sess.sub_status === "done" ? "" : " (slow)";
  const emb = sess.subtitles.map(t => `<option value="e:${t.index}" ${"e:" + t.index === sel ? "selected" : ""} ${t.supported ? "" : "disabled"}>${h(t.label)}${t.supported ? embNote : " (image, unsupported)"}</option>`).join("");
  return `<option value="">Off</option>`
    + (ext ? `<optgroup label="OpenSubtitles (instant)">${ext}</optgroup>` : "")
    + (emb ? `<optgroup label="From the file${sess.sub_status === "done" ? "" : " (downloads the whole file)"}">${emb}</optgroup>` : "");
}
const delayKey = (sid, sub) => `delay:${sid}:${sub}`;
const fmtDelay = d => (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d).toFixed(1) + "s";

function renderCastPanel() {
  const panel = $("#castPanel"); if (!panel) return;
  const sess = S.sess;
  const a = prefAudio(sess.audio, sess.default_audio), sub = prefSub(sess);
  const st = S.streams[S.streamIdx];
  panel.innerHTML = `<div class="panel">
    <div class="stream">${h(st.title.split("\n")[0])}\n${h(st.title.split("\n").slice(1).join("  "))}</div>
    ${S.streams.length > 1 ? `<label class="f" style="margin-bottom:10px">Source<select id="pStream">${S.streams.map(s => `<option value="${s.i}" ${s.i === S.streamIdx ? "selected" : ""}>${h(s.name.replace("\n", " "))} — ${h(s.title.split("\n")[0])}</option>`).join("")}</select></label>` : ""}
    <div class="row">
      <label class="f">Audio<select id="pAudio">${audioOpts(sess, a)}</select></label>
      <label class="f">Subtitles<select id="pSub">${subOpts(sess, sub)}</select></label>
    </div>
    <div class="sync-row" id="pSyncRow">Subtitle timing
      <div class="sync" id="pSync"><button data-d="-1">−1</button><button data-d="-0.5">−½</button><output id="pDelay">0.0s</output><button data-d="0.5">+½</button><button data-d="1">+1</button></div>
      <span>+ shows subtitles later</span></div>
    <div id="subState" class="muted" style="font-size:12px;margin-top:8px"></div>
    <div class="actions">
      <button class="btn primary" id="pCast">Cast to ${h(S.device)}</button>
      <span id="pMsg" class="muted" style="font-size:13px"></span>
    </div></div>`;
  $("#pStream") && ($("#pStream").onchange = e => prepare(+e.target.value));
  $("#pAudio").onchange = e => { store.set("prefAudio", sess.audio.find(t => t.index === +e.target.value)?.lang); watchSubs(); };
  $("#pSub").onchange = async e => {
    const v = e.target.value;
    store.set("prefSub2", v === "" ? "off" : { lang: subLang(sess, v), source: v[0] });
    if (v.startsWith("e:") && sess.sub_status !== "done" && sess.sub_status !== "running") {
      S.sess = await api(`/api/session/${sess.id}/extract`, { method: "POST" });
    }
    syncPanelDelay(); watchSubs();
  };
  $("#pSync").querySelectorAll("button").forEach(b => b.onclick = () => {
    const sub = $("#pSub").value; if (!sub) return;
    const k = delayKey(sess.id, sub), d = Math.round((store.get(k, 0) + +b.dataset.d) * 10) / 10;
    store.set(k, d); syncPanelDelay();
  });
  $("#pCast").onclick = castNow;
  syncPanelDelay(); watchSubs();
}
function syncPanelDelay() {
  const sub = $("#pSub")?.value;
  $("#pSyncRow").style.display = sub ? "" : "none";
  if (sub) $("#pDelay").textContent = fmtDelay(store.get(delayKey(S.sess.id, sub), 0));
}

async function watchSubs() {
  const el = $("#subState"); if (!el || !S.sess) return;
  const s = S.sess, sel = $("#pSub")?.value || "";
  const embedded = sel.startsWith("e:");
  el.innerHTML = "";
  if (embedded && s.sub_status === "running") {
    el.innerHTML = `Extracting subtitles from the file… ${Math.round(s.sub_progress * 100)}% (casting will wait for this)<div class="progress"><i style="width:${s.sub_progress * 100}%"></i></div>`;
  } else if (embedded && s.sub_status === "error") el.innerHTML = `<span class="err">Subtitle extraction failed: ${h(s.sub_error)}</span>`;
  if (s.sub_status === "running") {
    setTimeout(async () => {
      if (S.sess?.id !== s.id) return;
      S.sess = await api("/api/session/" + s.id);
      if (S.sess.sub_status === "done" && $("#pSub")) { const v = $("#pSub").value; $("#pSub").innerHTML = subOpts(S.sess, v); }
      watchSubs();
    }, 1500);
  }
  const needsRemux = $("#pAudio") && +$("#pAudio").value !== s.default_audio;
  if (needsRemux) el.innerHTML += `<div>Non-default audio: streamed through this server; seeking restarts the stream.</div>`;
}

async function castNow() {
  const btn = $("#pCast"), msg = $("#pMsg");
  const audio = +$("#pAudio").value, sub = $("#pSub").value || null;
  const sub_delay = sub ? store.get(delayKey(S.sess.id, sub), 0) : 0;
  btn.disabled = true;
  msg.innerHTML = `<span class="spin"></span> ${sub?.startsWith("e:") && S.sess.sub_status !== "done" ? "Waiting for subtitles…" : "Starting…"}`;
  try {
    await api("/api/cast", { method: "POST", body: { session: S.sess.id, device: S.device, audio, sub, sub_delay, poster: S.meta.poster } });
    msg.textContent = "Casting ✓";
    S.npSess = S.sess;
    pollStatus();
  } catch (err) { msg.innerHTML = `<span class="err">${h(err.message)}</span>`; }
  finally { btn.disabled = false; }
}

// ---------- now playing
let pollTimer;
async function pollStatus() {
  clearTimeout(pollTimer);
  try {
    const st = await api("/status?device=" + encodeURIComponent(S.device));
    S.status = st; renderNP();
  } catch { S.status = null; renderNP(); }
  pollTimer = setTimeout(pollStatus, 2000);
}
async function renderNP() {
  const st = S.status, np = $("#np");
  const active = st && st.title && ["PLAYING", "PAUSED", "BUFFERING"].includes(st.state);
  np.style.display = active ? "block" : "none";
  if (!active) return;
  $("#npTitle").textContent = st.title;
  $("#npSub").textContent = `${st.state === "BUFFERING" ? "Buffering · " : st.state === "PAUSED" ? "Paused · " : ""}${st.device}`;
  $("#npPlay").innerHTML = st.state === "PAUSED" ? ICON_PLAY : ICON_PAUSE;
  if (!S.seeking) {
    $("#npSeek").max = Math.floor(st.duration || 0); $("#npSeek").value = Math.floor(st.position || 0);
    $("#npPos").textContent = fmt(st.position); $("#npDur").textContent = fmt(st.duration);
  }
  if (document.activeElement !== $("#npVol")) $("#npVol").value = Math.round((st.volume ?? 0) * 100);
  // track switchers only for sessions started from the UI
  if (st.session && (!S.npSess || S.npSess.id !== st.session)) {
    try { S.npSess = await api("/api/session/" + st.session); } catch { S.npSess = null; }
  }
  const has = st.session && S.npSess;
  $("#npAudio").style.display = $("#npSubs").style.display = has ? "" : "none";
  $("#npSync").style.display = has && st.sub ? "" : "none";
  if (!has) $("#npSub").textContent += " · not started from this page: re-cast it here for audio, subtitle & sync controls";
  if (has && document.activeElement !== $("#npAudio") && document.activeElement !== $("#npSubs")) {
    $("#npAudio").innerHTML = audioOpts(S.npSess, st.audio);
    $("#npSubs").innerHTML = subOpts(S.npSess, st.sub ?? null);
  }
  if (has && st.sub && S.pendingDelay == null) $("#npDelay").textContent = fmtDelay(st.sub_delay || 0);
  $("#npPoster").src = S.npSess?.id === st.session && S.meta?.poster ? S.meta.poster : ($("#npPoster").src || "");
}
const ctl = (p, q = "") => api(`/${p}?device=${encodeURIComponent(S.device)}${q}`, { method: "POST" }).then(pollStatus).catch(e => alert(e.message));
$("#npPlay").onclick = () => ctl(S.status?.state === "PAUSED" ? "resume" : "pause");
$("#npStop").onclick = () => ctl("stop");
$("#npBack").onclick = () => ctl("seek", "&seconds=" + Math.max(0, (S.status?.position || 0) - 10));
$("#npFwd").onclick = () => ctl("seek", "&seconds=" + ((S.status?.position || 0) + 30));
$("#npSeek").oninput = e => { S.seeking = true; $("#npPos").textContent = fmt(+e.target.value); };
$("#npSeek").onchange = e => { S.seeking = false; ctl("seek", "&seconds=" + e.target.value); };
$("#npVol").onchange = e => ctl("volume", "&level=" + (+e.target.value / 100));
async function switchTracks(delay) {
  const audio = +$("#npAudio").value, sub = $("#npSubs").value || null;
  const sid = S.status?.session;
  const sub_delay = typeof delay === "number" ? delay : (sub ? store.get(delayKey(sid, sub), 0) : 0);
  if (sub && sid?.length && $("#npSubs").value.startsWith("e:") && S.npSess?.sub_status !== "done") {
    S.npSess = await api(`/api/session/${sid}/extract`, { method: "POST" });
  }
  $("#npSub").innerHTML = `<span class="spin"></span> ${sub?.startsWith("e:") && S.npSess?.sub_status !== "done" ? "Extracting subtitles from the file…" : "Switching…"}`;
  try { await api("/api/tracks", { method: "POST", body: { device: S.device, audio, sub, sub_delay } }); }
  catch (e) { alert(e.message); }
  S.pendingDelay = null;
  $("#npAudio").blur(); $("#npSubs").blur(); pollStatus();
}
// Sync nudges: applied immediately by switching to a pre-loaded, pre-shifted subtitle copy on the TV.
// Taps made while a request is in flight are coalesced into the latest value.
let delayBusy = false;
async function sendDelay() {
  if (delayBusy) return;
  delayBusy = true;
  try {
    while (S.pendingDelay != null && S.pendingDelay !== S.sentDelay) {
      const d = S.pendingDelay; S.sentDelay = d;
      const r = await api("/api/sub_delay", { method: "POST", body: { device: S.device, delay: d } });
      if (!r.instant) $("#npSub").innerHTML = `<span class="spin"></span> Reloading subtitles…`;
    }
  } catch (e) { alert(e.message); }
  finally { delayBusy = false; S.pendingDelay = null; S.sentDelay = null; pollStatus(); }
}
$("#npSync").querySelectorAll("button").forEach(b => b.onclick = () => {
  const sid = S.status?.session, sub = S.status?.sub; if (!sid || !sub) return;
  const cur = S.pendingDelay ?? (S.status.sub_delay || 0);
  S.pendingDelay = Math.round((cur + +b.dataset.d) * 10) / 10;
  store.set(delayKey(sid, sub), S.pendingDelay);
  $("#npDelay").textContent = fmtDelay(S.pendingDelay);
  sendDelay();
});
$("#npAudio").onchange = () => switchTracks();
$("#npSubs").onchange = () => switchTracks();

renderHome();
loadConfig().then(pollStatus).catch(e => { $("#view").innerHTML = `<div class="empty err">${h(e.message)}</div>`; });
$("#q").focus();
</script>
</body>
</html>
